# Publie le jeu sur GitHub Pages à chaque envoi sur `main`.
#
# Le jeu est un site statique : il n'y a rien à compiler, on téléverse le dépôt
# tel quel. Cette version en ligne est un confort pour essayer sans rien
# installer ; le jeu reste jouable hors connexion via `play.sh` / `play.bat`.
#
# Activation (une seule fois) : Settings ▸ Pages ▸ Source : « GitHub Actions ».

name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Active Pages automatiquement si ce n'est pas déjà fait, pour ne pas
          # exiger un passage manuel dans les réglages du dépôt.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
